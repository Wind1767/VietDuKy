<!DOCTYPE html>
<html lang="vi">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Liên hệ – Việt Du Ký
  </title>
  <meta content="Liên hệ tư vấn và đặt tour du lịch Việt Nam." name="description"/>
  <meta content="#0c3b36" name="theme-color"/>
  <meta content="Liên hệ – Việt Du Ký" property="og:title"/>
  <link href="/favicon.svg" rel="icon" type="image/svg+xml"/>
  <link href="/favicon.png" rel="icon" type="image/png" sizes="256x256"/>
  <link href="/favicon.ico" rel="icon" sizes="48x48"/>
  <link href="/apple-touch-icon.png" rel="apple-touch-icon"/>
  <link href="/manifest.webmanifest" rel="manifest"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,600&amp;display=swap&amp;subset=vietnamese" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;icon_names=account_circle,add,add_a_photo,add_location,admin_panel_settings,arrow_back,arrow_downward,arrow_forward,arrow_right_alt,arrow_upward,badge,bar_chart,block,calendar_month,call,campaign,check,check_circle,chevron_left,chevron_right,close,confirmation_number,content_copy,dark_mode,dashboard,delete,description,devices,done_all,download,eco,edit,error,event,expand_more,explore,favorite,format_quote,forum,forward_to_inbox,group,groups,handshake,history,inbox,keyboard,light_mode,location_on,lock,lock_open,logout,luggage,mail,manage_accounts,map,mark_email_read,menu,menu_open,mood,north_east,person,person_add,print,quickreply,refresh,remove,restaurant,route,save,schedule,search,sell,send,shield_lock,smart_toy,star,support_agent,swap_vert,table_view,thumb_up,trending_down,trending_up,upload,verified,visibility,visibility_off,warning,wifi_off&amp;display=block" rel="stylesheet"/>
  <link as="image" fetchpriority="high" href="images/hero.jpg" rel="preload"/>
  <script src="/js/site.js"></script>
  <link href="css/style.css" rel="stylesheet"/>
  <link href="css/components.css" rel="stylesheet"/>
  <link href="css/form-controls.css" rel="stylesheet"/>
 <script defer src="/js/turnstile.js"></script>
</head>
 <body>
  <header class="ph">
   <div class="wrap">
    <h1>
     Liên hệ đặt tour
    </h1>
    <p>
     Cho chúng tôi biết bạn muốn đi đâu
    </p>
   </div>
  </header>
  <section>
   <div class="wrap two">
    <div class="info rv l">
     <h2>
      Gặp tư vấn viên
     </h2>
     <p>
      <span class="ms">call</span>
      <span>
       Hotline:
       <b data-site="hotline">1900 1234</b>
       (<span data-site="work_hours">8:00 – 21:00 hằng ngày</span>)
      </span>
     </p>
     <p>
      <span class="ms">mail</span>
      <span data-site="contact_email">buivanphong7191@gmail.com</span>
     </p>
     <p>
      <span class="ms">location_on</span>
      <span data-site="address">Phan Thiết, Lâm Đồng</span>
     </p>
    </div>
    <form class="ct rv r" data-api="booking" data-msg="Cảm ơn bạn! Chúng tôi sẽ phản hồi trong 30 phút.">
     <input aria-label="Họ và tên" autocomplete="name" maxlength="80" name="name" placeholder="Họ và tên" required=""/>
     <input aria-label="Số điện thoại" autocomplete="tel" inputmode="tel" maxlength="20" name="phone" placeholder="Số điện thoại" required="" type="tel"/>
     <input aria-label="Email (không bắt buộc)" autocomplete="email" class="guest-only" inputmode="email" maxlength="254" name="email" placeholder="Email nhận thư xác nhận (không bắt buộc)" type="email"/>
     <select aria-label="Điểm đến" name="destination">
      <option value="">
       Điểm đến quan tâm
      </option>
      <option>
       Vịnh Hạ Long
      </option>
      <option>
       Sa Pa
      </option>
      <option>
       Hội An
      </option>
      <option>
       Huế
      </option>
      <option>
       Đà Lạt
      </option>
      <option>
       Phú Quốc
      </option>
     </select>
     <div class="row2">
      <input aria-label="Ngày khởi hành" name="date" type="date"/>
      <input aria-label="Số người" inputmode="numeric" max="200" min="1" name="people" placeholder="Số người" type="number"/>
     </div>
     <input aria-label="Mã giảm giá" autocomplete="off" maxlength="20" name="coupon" placeholder="Mã giảm giá (nếu có)" style="text-transform:uppercase" type="text"/>
     <p class="cp-hint" hidden></p>
     <input autocomplete="off" class="hp" name="website" tabindex="-1" aria-hidden="true"/>
     <input name="source" type="hidden" value="contact"/>
     <textarea aria-label="Lời nhắn" maxlength="1000" name="message" placeholder="Lời nhắn" rows="4"></textarea>
     <button class="btn">
      Gửi yêu cầu
     </button>
    </form>
   </div>
  </section>
  <script defer src="/js/focus-fix.js"></script>
  <script defer="" src="js/main.js">
  </script>
  <script defer src="/js/form-controls.js"></script>
 </body>
</html>

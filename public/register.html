<!DOCTYPE html>
<html lang="vi">
 <head>
	<meta charset="utf-8"/>
	<meta content="width=device-width,initial-scale=1" name="viewport"/>
	<title>Đăng ký – Việt Du Ký</title>
	<meta content="#0c3b36" name="theme-color"/>
	
	<link href="/favicon.svg" rel="icon" type="image/svg+xml"/>
	<link href="/favicon.png" rel="icon" type="image/png" sizes="256x256"/>
	<link href="/favicon.ico" rel="icon" sizes="48x48"/>
	<link href="/apple-touch-icon.png" rel="apple-touch-icon"/>
	<link href="/manifest.webmanifest" rel="manifest"/>
	<link href="https://fonts.googleapis.com" rel="preconnect"/>
	<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
	<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&amp;display=swap&amp;subset=vietnamese" rel="stylesheet"/>
	<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;icon_names=account_circle,add,add_a_photo,add_location,admin_panel_settings,arrow_back,arrow_downward,arrow_forward,arrow_right_alt,arrow_upward,badge,bar_chart,block,calendar_month,call,campaign,check,check_circle,chevron_left,chevron_right,close,confirmation_number,content_copy,dark_mode,dashboard,delete,description,devices,done_all,download,eco,edit,error,event,expand_more,explore,favorite,format_quote,forum,forward_to_inbox,group,groups,handshake,history,inbox,keyboard,light_mode,location_on,lock,lock_open,logout,luggage,mail,manage_accounts,map,mark_email_read,menu,menu_open,mood,north_east,person,person_add,print,quickreply,refresh,remove,restaurant,route,save,schedule,search,sell,send,shield_lock,smart_toy,star,support_agent,swap_vert,table_view,thumb_up,trending_down,trending_up,upload,verified,visibility,visibility_off,warning,wifi_off&amp;display=block" rel="stylesheet"/>
	<script src="/js/site.js"></script>
	<link href="css/style.css" rel="stylesheet"/>
	<link href="css/form-controls.css" rel="stylesheet"/>
	<link href="css/components.css" rel="stylesheet"/>
	<link href="css/mfa.css" rel="stylesheet"/>
 <script defer src="/js/turnstile.js"></script>
</head>
 <body>
	<header class="ph sm">
	 <div class="wrap">
		<h1>Tạo tài khoản</h1>
		<p>Đặt tour nhanh hơn, theo dõi mọi yêu cầu của bạn</p>
	 </div>
	</header>
	<section class="auth">
	 <div class="auth-card" id="card">
		<h2>Đăng ký</h2>
		<p class="sub">Chúng tôi sẽ gửi email xác minh tới địa chỉ bạn nhập.</p>
		<form class="ct" data-auth="register" novalidate="">
		 <input aria-label="Họ và tên" autocomplete="name" maxlength="80" name="name" placeholder="Họ và tên" required=""/>
		 <input aria-label="Email" autocomplete="email" inputmode="email" maxlength="254" name="email" placeholder="Email" required="" type="email"/>
		 <input aria-label="Số điện thoại" autocomplete="tel" inputmode="tel" maxlength="20" name="phone" placeholder="Số điện thoại" required="" type="tel"/>
			<div class="pw">
			 <input aria-label="Mật khẩu" autocomplete="new-password" maxlength="128" data-pass-new="" minlength="10" name="password" placeholder="Mật khẩu (ít nhất 10 ký tự)" required="" type="password"/>
			 <button aria-label="Hiện mật khẩu" class="pw-toggle" type="button"><span class="ms">visibility</span></button>
			</div>
		 <input autocomplete="off" class="hp" name="website" tabindex="-1" aria-hidden="true"/>
		 <p class="auth-err" role="alert" hidden=""></p>
		 <button class="btn block">Tạo tài khoản</button>
		</form>
		<p class="auth-foot">Đã có tài khoản? <a href="/login" data-keepnext="">Đăng nhập</a></p>
	 </div>
	</section>
	<script defer src="/js/focus-fix.js"></script>
	<script defer="" src="js/main.js"></script>
	<script defer src="js/mfa-ui.js"></script>
	<script defer="" src="js/auth.js"></script>
 </body>
</html>

<!DOCTYPE html>
<html lang="vi">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>Mật khẩu mới – Việt Du Ký</title>
  <meta content="#0c3b36" name="theme-color"/>
  
  <link href="/favicon.svg" rel="icon" type="image/svg+xml"/>
  <link href="/favicon.png" rel="icon" type="image/png" sizes="256x256"/>
  <link href="/favicon.ico" rel="icon" sizes="48x48"/>
  <link href="/apple-touch-icon.png" rel="apple-touch-icon"/>
  <link href="/manifest.webmanifest" rel="manifest"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&amp;display=swap&amp;subset=vietnamese" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;icon_names=account_circle,add,add_a_photo,admin_panel_settings,arrow_back,arrow_downward,arrow_forward,arrow_upward,badge,bar_chart,block,calendar_month,call,check,check_circle,chevron_left,chevron_right,close,content_copy,dark_mode,dashboard,delete,download,eco,error,event,expand_more,explore,favorite,format_quote,forum,forward_to_inbox,group,groups,handshake,history,inbox,light_mode,location_on,lock,lock_open,logout,luggage,mail,manage_accounts,map,mark_email_read,menu,menu_open,mood,north_east,person,person_add,print,quickreply,refresh,restaurant,route,schedule,search,sell,send,star,support_agent,upload,verified,visibility,visibility_off,wifi_off&amp;display=block" rel="stylesheet"/>
  <script src="/js/site.js"></script>
  <link href="css/style.css" rel="stylesheet"/>
  <link href="css/form-controls.css" rel="stylesheet"/>
  <link href="css/components.css" rel="stylesheet"/>
 </head>
 <body>
  <header class="ph sm"><div class="wrap"><h1>Mật khẩu mới</h1><p>Chọn mật khẩu mới cho tài khoản của bạn</p></div></header>
  <section class="auth"><div class="auth-card" id="card">
    <h2>Chọn mật khẩu mới</h2>
    <p class="sub">Mật khẩu cần ít nhất <span data-minpass>10</span> ký tự.</p>
    <form class="ct" data-auth="reset" novalidate="">
     <div class="pw">
      <input aria-label="Mật khẩu mới" autocomplete="new-password" maxlength="128" data-pass-new="" minlength="10" name="password" placeholder="Mật khẩu mới (ít nhất 10 ký tự)" required="" type="password"/>
      <button aria-label="Hiện mật khẩu" class="pw-toggle" type="button"><span class="ms">visibility</span></button>
     </div>
     <p class="auth-err" role="alert" hidden=""></p>
     <button class="btn block">Lưu mật khẩu mới</button>
    </form>
   </div></section>
  <script defer src="/js/focus-fix.js"></script>
  <script defer="" src="js/main.js"></script>
  <script defer="" src="js/auth.js"></script>
 </body>
</html>
